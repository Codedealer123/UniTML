name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y build-essential cmake ninja-build pkg-config libcurl4-openssl-dev
        # Try 4.0 dev first (Jammy/Debian), then 4.1 dev (Noble)
        sudo apt install -y libwebkit2gtk-4.0-dev || sudo apt install -y libwebkit2gtk-4.1-dev
    
    - name: Clean build directory
      run: cmake -E remove_directory build

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: cmake --build build --config Release
    
    - name: Setup test environment (Unix)
      if: runner.os != 'Windows'
      run: |
        mkdir -p test-app/backend
        mkdir -p test-app/frontend

    - name: Setup test environment (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path test-app/backend -Force | Out-Null
        New-Item -ItemType Directory -Path test-app/frontend -Force | Out-Null
    
    - name: Create test backend (Unix)
      if: runner.os != 'Windows'
      run: |
        cat > test-app/backend/server.js << 'EOF'
        const http = require('http');
        const port = process.env.PORT || 5173;
        const server = http.createServer((req, res) => {
          if (req.url === '/health') {
            res.writeHead(200, {'Content-Type': 'application/json'});
            res.end('{"status":"ok"}');
          } else {
            res.writeHead(200, {'Content-Type': 'text/html'});
            res.end('<html><body><h1>Test Backend</h1></body></html>');
          }
        });
        server.listen(port, '127.0.0.1', () => {
          console.log(`Server running at http://127.0.0.1:${port}/`);
        });
        EOF
        cat > test-app/backend/package.json << 'EOF'
        {
          "name": "test-backend",
          "scripts": {
            "start": "node server.js"
          }
        }
        EOF
    
    - name: Create test backend (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        @'
        const http = require('http');
        const port = process.env.PORT || 5173;
        const server = http.createServer((req, res) => {
          if (req.url === '/health') {
            res.writeHead(200, {'Content-Type': 'application/json'});
            res.end('{"status":"ok"}');
          } else {
            res.writeHead(200, {'Content-Type': 'text/html'});
            res.end('<html><body><h1>Test Backend</h1></body></html>');
          }
        });
        server.listen(port, '127.0.0.1', () => {
          console.log(`Server running at http://127.0.0.1:${port}/`);
        });
        '@ | Out-File -FilePath test-app/backend/server.js -Encoding UTF8
        
        @'
        {
          "name": "test-backend",
          "scripts": {
            "start": "node server.js"
          }
        }
        '@ | Out-File -FilePath test-app/backend/package.json -Encoding UTF8
    
    - name: Create test frontend
      run: |
        echo '<html><head><title>Test</title></head><body><h1>Frontend Test</h1></body></html>' > test-app/frontend/index.html
    
    - name: Smoke test - health check (Unix)
      if: runner.os != 'Windows'
      timeout-minutes: 2
      run: |
        cd test-app
        node backend/server.js &
        BACKEND_PID=$!
        sleep 5
        curl -f http://127.0.0.1:5173/health || (kill $BACKEND_PID; exit 1)
        kill $BACKEND_PID

    - name: Smoke test - health check (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      timeout-minutes: 2
      run: |
        Set-Location test-app
        $proc = Start-Process node -ArgumentList 'backend/server.js' -PassThru
        try {
          Start-Sleep -Seconds 5
          $response = Invoke-WebRequest -Uri 'http://127.0.0.1:5173/health' -UseBasicParsing
          if ($response.StatusCode -ne 200) {
            throw "Unexpected status code: $($response.StatusCode)"
          }
        } finally {
          if ($proc -and -not $proc.HasExited) {
            $proc.Kill()
            $proc.WaitForExit()
          }
        }
    
    - name: Package Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./scripts/package_win.ps1
    
    - name: Package macOS
      if: runner.os == 'macOS'
      run: |
        chmod +x scripts/package_mac.sh
        ./scripts/package_mac.sh
    
    - name: Package Linux
      if: runner.os == 'Linux'
      run: |
        chmod +x scripts/package_linux.sh
        ./scripts/package_linux.sh
    
    - name: Upload Windows artifact
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: unitml-win-x64
        path: unitml-win-x64.zip
    
    - name: Upload macOS artifact
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: unitml-macos
        path: unitml-macos.zip
    
    - name: Upload Linux artifact
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: unitml-linux
        path: unitml-linux.tar.gz
